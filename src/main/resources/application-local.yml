spring:
  application:
    name: carsales

  datasource:
    url: jdbc:postgresql://localhost:5432/carsales_db
    username: postgres
    password: 3092

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

